name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: tnnd-extension-v1-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
