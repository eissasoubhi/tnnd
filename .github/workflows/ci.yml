name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify extension version consistency
        run: node -e "const p=require('./package.json');const m=require('./public/manifest.json');if(p.version!==m.version){console.error('Version mismatch',p.version,m.version);process.exit(1)}"
      - run: npm run build
      - name: Add build integrity metadata
        run: |
          printf '{"commit":"%s","version":"%s"}\n' "$GITHUB_SHA" "$(node -p "require('./package.json').version")" > dist/BUILD-INFO.json
          find dist -type f ! -name BUILD-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > dist/BUILD-SHA256SUMS.txt
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: tnnd-extension-v1-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
