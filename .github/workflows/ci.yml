name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Guard intentionally empty public README
        run: test ! -s README.md
      - name: Reject committed local environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo 'Local environment files must not be committed; keep only .env.example templates.' >&2
            exit 1
          fi
      - name: Verify extension version consistency
        run: node -e "const p=require('./package.json');const m=require('./public/manifest.json');if(p.version!==m.version){console.error('Version mismatch',p.version,m.version);process.exit(1)}"
      - run: npm run build
      - name: Install Chrome for extension visual smoke
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Check Neo Bento responsive and light/dark extension layouts
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/visual-qa-extension.mjs
      - name: Upload Neo Bento screenshots for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tnnd-neo-bento-extension-visual-${{ github.sha }}
          path: artifacts/neo-bento-extension/
          if-no-files-found: warn
          retention-days: 7
      - name: Install Web dependencies for functional browser QA
        run: npm install --prefix apps/web
      - name: Build Web UI with the synthetic same-origin API
        env:
          VITE_TNND_API_BASE_URL: /
        run: npm run build --prefix apps/web
      - name: Exercise TNND Web buttons and navigation with unpacked extension
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/functional-qa-web.mjs
      - name: Upload Web interaction QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tnnd-web-interaction-qa-${{ github.sha }}
          path: artifacts/web-interaction-qa/
          if-no-files-found: warn
          retention-days: 7
      - name: Add build integrity metadata
        run: |
          printf '{"commit":"%s","version":"%s"}\n' "$GITHUB_SHA" "$(node -p "require('./package.json').version")" > dist/BUILD-INFO.json
          find dist -type f ! -name BUILD-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > dist/BUILD-SHA256SUMS.txt
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: tnnd-extension-v1-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
