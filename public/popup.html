<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNND</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171717}*{box-sizing:border-box}body{margin:0;width:340px;background:#f6f6f7}main{padding:16px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}h1{font-size:20px;margin:0}.version{padding:3px 8px;border-radius:999px;background:#e4e4e7;font-size:11px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:14px;margin-bottom:12px}p{margin:0;color:#666;font-size:12px;line-height:1.45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{border:0;border-radius:9px;padding:10px 11px;font-weight:700;cursor:pointer}.primary{grid-column:1/-1;background:#171717;color:#fff}.secondary{background:#fff;border:1px solid #d4d4d8}.warning{font-size:11px;margin-top:9px;color:#71717a}#status{font-size:11px;color:#52525b;min-height:16px;margin-top:8px}</style></head><body><main><header><h1>TNND</h1><span id="extensionVersion" class="version"></span></header><div class="card"><p>Settings, preview and debugging tools for the current Tinder tab.</p><div class="actions"><button id="openSettings" class="secondary">Settings</button><button id="openPreview" class="secondary">Chat preview</button><button id="exportDiagnostics" class="primary">Export Tinder diagnostics ZIP</button></div><p class="warning">The diagnostic DOM is redacted and sensitive request/session data is excluded. The optional visible screenshot can still show what is currently visible on Tinder.</p><div id="status"></div></div></main><script src="assets/popup.js"></script></body></html>
