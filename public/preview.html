<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNND Chat Preview</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#171717;background:#f6f6f7}*{box-sizing:border-box}body{margin:0}main{width:min(1080px,calc(100% - 32px));margin:32px auto 64px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}h1{margin:0 0 5px}p{margin:0;color:#666;line-height:1.5}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:#171717;color:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:default}.meta{font-size:13px;color:#71717a;margin-top:8px}.version{display:inline-block;margin-left:7px;padding:3px 8px;border-radius:999px;background:#e4e4e7;font-size:12px;vertical-align:middle}.controls{background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:18px;margin:18px 0}.selection{display:grid;grid-template-columns:1fr 1fr;gap:24px}.selector-group{display:grid;gap:9px}.selector-group>strong{margin-bottom:3px}.check{display:flex;gap:9px;align-items:flex-start;font-size:13px}.check input{margin-top:3px}.check span{display:grid;gap:2px}.check small{display:block;color:#71717a;font-weight:400}.control-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}.call-estimate{font-size:12px;color:#71717a}#cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}section{background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:18px}.card-heading{margin-bottom:14px}h2{font-size:16px;margin:0}.chat{display:grid;gap:9px}.bubble{max-width:82%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.45}.bubble.them{justify-self:start;background:#f1f1f3;border-bottom-left-radius:5px}.bubble.tnnd{justify-self:end;background:#171717;color:#fff;border-bottom-right-radius:5px}.speaker{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.65;margin-bottom:3px}@media(max-width:800px){#cards,.selection{grid-template-columns:1fr}}@media(max-width:650px){header{display:block </style></head><body><main><header><div><h1>Chat preview <span id="extensionVersion" class="version"></span></h1><p>Compare complete conversation samples across different style and language mixes without changing your live saved profile.</p><div id="summary" class="meta"></div></div></header><div class="controls"><div id="selection" class="selection"></div><div class="control-actions"><button id="generateMatrix">Generate preview matrix</button><span id="callEstimate" class="call-estimate"></span></div><p class="meta">Each selected conversation generates two TNND turns. Preview variants are temporary and never overwrite your saved configuration.</p></div><div id="status" class="meta"></div><div id="cards"></div><script src="assets/preview.js"></script></main></body></html>
