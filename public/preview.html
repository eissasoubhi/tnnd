<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNND Chat Preview</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171717;background:#f6f6f7}*{box-sizing:border-box}body{margin:0}main{width:min(820px,calc(100% - 32px));margin:32px auto 64px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}h1{margin:0 0 5px}p{margin:0;color:#666}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:#171717;color:#fff;cursor:pointer}#cards{display:grid;gap:14px;margin-top:18px}section{background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:18px}h2{font-size:16px;margin:0 0 12px}pre{white-space:pre-wrap;font:13px/1.5 system-ui;color:#666;margin:0 0 14px}.reply{padding:12px 14px;border-radius:14px;background:#f1f1f3;font-size:14px;font-weight:600}.meta{font-size:13px;color:#71717a;margin-top:8px}.version{display:inline-block;margin-left:7px;padding:3px 8px;border-radius:999px;background:#e4e4e7;font-size:12px;vertical-align:middle}@media(max-width:650px){header{display:block}button{margin-top:12px}}</style></head><body><main><header><div><h1>Chat preview <span id="extensionVersion" class="version"></span></h1><p>Examples generated from the configuration currently saved in TNND.</p><div id="summary" class="meta"></div></div><button id="regenerate">Regenerate</button></header><div id="status" class="meta"></div><div id="cards"></div><script src="assets/preview.js"></script></main></body></html>
