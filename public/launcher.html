<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TNND</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 292px; color: #19362e; background: #f5f8f4; font: 14px system-ui, sans-serif; }
    main { padding: 20px; display: grid; gap: 18px; }
    header { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 20px; letter-spacing: -.04em; margin: 0; }
    .build-version { font-size: 11px; color: #647b70; margin-top: 12px; text-align: center; font-variant-numeric: tabular-nums; }
    #engineStatus { display: flex; align-items: center; gap: 9px; font-size: 13px; min-height: 28px; }
    #engineStatus::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #94a3a0; flex: none; }
    #engineStatus[data-state="running"]::before { background: #248459; }
    #engineStatus[data-state="busy"]::before { background: #db9836; }
    #engineStatus[data-state="paused"]::before { background: #db9836; }
    #engineStatus[data-state="error"]::before { background: #bd524b; }
    #toggleAutomation { display: block; width: 100%; min-height: 54px; padding: 13px; border: 0; border-radius: 13px; background: #234b3d; color: #fff; font: inherit; font-weight: 750; font-size: 16px; cursor: pointer; }
    #toggleAutomation[data-mode="stop"] { background: #fafcf8; border: 1px solid #a5bcb1; color: #234b3d; }
    #toggleAutomation:disabled { cursor: wait; opacity: .72; }
    #toggleAutomation:focus-visible, .mode-button:focus-visible { outline: 3px solid #8070dc; outline-offset: 3px; }
    .mode-selector { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: -10px; }
    .mode-button { min-height: 46px; min-width: 0; padding: 10px 2px; border: 1px solid #c3d5c8; border-radius: 10px; background: #fff; color: #234b3d; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; }
    .mode-button[aria-pressed="true"] { background: #d9efcc; border: 2px solid #234b3d; font-weight: 750; }
    .mode-button:disabled { opacity: .6; cursor: wait; }
    .mode-button:not(:disabled):hover { border-color: #234b3d; }
    .mode-label { font-size: 11px; color: #5e746b; margin: -9px 0 0; }
    #feedback { font-size: 12px; color: #5e746b; line-height: 1.45; min-height: 16px; margin: 0; overflow-wrap: anywhere; }
    #reachedLimits { padding: 11px 12px; border: 1px solid #cfded3; background: #f0f5ef; border-radius: 11px; }
    #reachedLimits[data-has-reached="true"] { border-color: #d9c5a1; background: #faf4e6; }
    #reachedLimits h2 { margin: 0 0 7px; font-size: 13px; font-weight: 700; }
    #reachedLimits ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
    #reachedLimits li { display: flex; gap: 8px; justify-content: space-between; align-items: baseline; font-size: 12px; }
    #reachedLimits .limit-count { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #reachedLimits li[data-reached="true"] .limit-count { color: #8e611e; }
    #reachedLimits .limit-note { font-size: 11px; color: #5e746b; margin: 9px 0 0; }
    footer { border-top: 1px solid #d9e5dc; padding-top: 12px; text-align: center; }
    a { color: #325d4e; font-size: 12px; }
  </style><link rel="stylesheet" href="neo-bento.css">
</head>
<body>
  <main>
    <header><h1>TNND</h1></header>
    <div id="engineStatus" data-state="busy" role="status">Vérification…</div>
    <button type="button" id="toggleAutomation" disabled>Démarrer</button>
    <div class="mode-selector" role="group" aria-label="Choisir manuellement une activité">
      <button type="button" class="mode-button" data-activity="swipe" aria-pressed="false" disabled>Swipe</button>
      <button type="button" class="mode-button" data-activity="new-match" aria-pressed="false" disabled>Matches</button>
      <button type="button" class="mode-button" data-activity="active-chat" aria-pressed="false" disabled>Chat</button>
    </div>
    <p class="mode-label">Mode manuel jusqu'au prochain arrêt.</p>
    <p id="feedback" role="status" aria-live="polite"></p>
    <section id="reachedLimits" aria-label="Compteurs quotidiens">
      <h2>Quotas du jour</h2>
      <ul id="reachedLimitsList">
        <li><span>Tentatives de Like (TNND)</span><strong class="limit-count">— / —</strong></li>
        <li><span>Sessions Auto Swipe</span><strong class="limit-count">— / —</strong></li>
      </ul>
      <p class="limit-note" id="reachedLimitsNote">Chargement des compteurs…</p>
    </section>
    <footer><a id="webSettingsLink" href="http://127.0.0.1:5173/#workspace-settings-section" target="_blank" rel="noopener noreferrer" title="Réutilise l’onglet TNND Web déjà ouvert pour conserver la connexion">Configuration dans TNND Web</a><div id="version" class="build-version">Version en cours de vérification…</div></footer>
  </main>
  <script src="assets/launcher.js"></script>
</body>
</html>
